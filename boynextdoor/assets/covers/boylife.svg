<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-boylife" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EA8DE"/>
      <stop offset="100%" stop-color="#5E60CE"/>
    </linearGradient>
    <filter id="shadow-boylife" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg-boylife)"/>
  <rect x="25" y="25" width="450" height="450" rx="16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 6" opacity="0.6"/>

  <g transform="translate(250, 200)" filter="url(#shadow-boylife)">
    <circle cx="0" cy="0" r="95" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6"/>
    <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="26" fill="#5E60CE" text-anchor="middle">COUNT TO</text>
    <text x="0" y="22" font-family="'Impact', sans-serif" font-size="28" fill="#FFBE0B" text-anchor="middle">LOVE</text>
  </g>

  <g transform="translate(250, 400)" filter="url(#shadow-boylife)">
    <rect x="-140" y="-45" width="280" height="65" rx="12" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5"/>
    <text x="0" y="-7" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#4EA8DE" text-anchor="middle" letter-spacing="2">BOYLIFE</text>
    <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2B2D42" text-anchor="middle" letter-spacing="3">JAPAN 2ND SINGLE</text>
  </g>
  <text x="250" y="65" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOYNEXTDOOR</text>
</svg>

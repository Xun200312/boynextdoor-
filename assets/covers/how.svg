<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-how" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE0B"/>
      <stop offset="50%" stop-color="#FB5607"/>
      <stop offset="100%" stop-color="#3A86FF"/>
    </linearGradient>
    <filter id="shadow-how" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg-how)"/>
  
  <!-- Retro TV / Screen Graphic -->
  <g transform="translate(250, 200)" filter="url(#shadow-how)">
    <rect x="-120" y="-85" width="240" height="170" rx="20" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6"/>
    <!-- Antenna -->
    <line x1="-30" y1="-85" x2="-60" y2="-125" stroke="#2B2D42" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="-85" x2="60" y2="-125" stroke="#2B2D42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-60" cy="-125" r="6" fill="#FB5607"/>
    <circle cx="60" cy="-125" r="6" fill="#3A86FF"/>
    
    <!-- Screen -->
    <rect x="-100" y="-70" width="170" height="140" rx="10" fill="#2B2D42"/>
    <text x="-15" y="-10" font-family="'Impact', sans-serif" font-size="28" fill="#FFBE0B" text-anchor="middle">EARTH</text>
    <text x="-15" y="16" font-family="'Impact', sans-serif" font-size="28" fill="#FF006E" text-anchor="middle">WIND &amp;</text>
    <text x="-15" y="42" font-family="'Impact', sans-serif" font-size="28" fill="#3A86FF" text-anchor="middle">FIRE</text>

    <!-- Knobs -->
    <circle cx="95" cy="-30" r="10" fill="#FFBE0B" stroke="#2B2D42" stroke-width="3"/>
    <circle cx="95" cy="15" r="10" fill="#FB5607" stroke="#2B2D42" stroke-width="3"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 400)" filter="url(#shadow-how)">
    <rect x="-140" y="-45" width="280" height="65" rx="12" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5"/>
    <text x="0" y="-7" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#FB5607" text-anchor="middle" letter-spacing="3">HOW?</text>
    <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2D42" text-anchor="middle" letter-spacing="3">2ND EP ALBUM</text>
  </g>
  <text x="250" y="55" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOYNEXTDOOR</text>
</svg>

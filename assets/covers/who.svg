<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-who" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#0056D2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg-who)"/>
  <rect x="25" y="25" width="450" height="450" rx="16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>
  
  <!-- Door Graphic -->
  <g transform="translate(185, 120)" filter="url(#shadow)">
    <!-- Door Frame -->
    <rect x="-10" y="-10" width="150" height="240" rx="8" fill="#FFBE0B" stroke="#2B2D42" stroke-width="6"/>
    <!-- Door Leaf -->
    <rect x="0" y="0" width="130" height="220" rx="4" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5"/>
    <!-- Panels -->
    <rect x="15" y="15" width="100" height="85" rx="4" fill="#EBF4FF" stroke="#2B2D42" stroke-width="4"/>
    <rect x="15" y="115" width="100" height="90" rx="4" fill="#EBF4FF" stroke="#2B2D42" stroke-width="4"/>
    <!-- Knob -->
    <circle cx="112" cy="115" r="9" fill="#FFBE0B" stroke="#2B2D42" stroke-width="4"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 400)">
    <rect x="-140" y="-45" width="280" height="60" rx="12" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5" filter="url(#shadow)"/>
    <text x="0" y="-8" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#2B2D42" text-anchor="middle" letter-spacing="2">WHO!</text>
    <text x="0" y="10" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3A86FF" text-anchor="middle" letter-spacing="3">1ST SINGLE ALBUM</text>
  </g>

  <!-- Top band -->
  <text x="250" y="75" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOYNEXTDOOR</text>
  <text x="250" y="95" font-family="sans-serif" font-size="11" fill="#FFBE0B" text-anchor="middle" letter-spacing="2">DEBUT 2023.05.30</text>
</svg>

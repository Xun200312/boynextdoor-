<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-and" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#118AB2"/>
    </linearGradient>
    <filter id="shadow-and" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg-and)"/>
  
  <!-- Cassette Tape Graphic -->
  <g transform="translate(250, 195)" filter="url(#shadow-and)">
    <rect x="-130" y="-80" width="260" height="160" rx="14" fill="#FFFFFF" stroke="#2B2D42" stroke-width="6"/>
    <rect x="-105" y="-55" width="210" height="80" rx="6" fill="#E6FAF5" stroke="#2B2D42" stroke-width="4"/>
    <!-- Reels -->
    <circle cx="-50" cy="-15" r="22" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4"/>
    <circle cx="50" cy="-15" r="22" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4"/>
    <circle cx="-50" cy="-15" r="7" fill="#2B2D42"/>
    <circle cx="50" cy="-15" r="7" fill="#2B2D42"/>
    <rect x="-25" y="-22" width="50" height="14" fill="#2B2D42" rx="3"/>
    <!-- Tape Label -->
    <text x="0" y="55" font-family="'Impact', sans-serif" font-size="18" fill="#118AB2" text-anchor="middle">GOOD DAY / JP DEBUT</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 400)" filter="url(#shadow-and)">
    <rect x="-140" y="-45" width="280" height="65" rx="12" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5"/>
    <text x="0" y="-7" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#06D6A0" text-anchor="middle" letter-spacing="3">AND,</text>
    <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2D42" text-anchor="middle" letter-spacing="3">JAPAN 1ST SINGLE</text>
  </g>
  <text x="250" y="55" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOYNEXTDOOR</text>
</svg>

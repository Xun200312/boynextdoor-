<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-1999" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338EC"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
    <filter id="shadow-1999" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="5" dy="6" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg-1999)"/>
  
  <!-- CD Jewel Case / Disc graphic -->
  <g transform="translate(250, 195)" filter="url(#shadow-1999)">
    <!-- CD Vinyl Disc -->
    <circle cx="0" cy="0" r="105" fill="#1E2238" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#8338EC" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#FFBE0B" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="#F3E8FF" stroke="#2B2D42" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#8338EC"/>
    <text x="0" y="5" font-family="'Impact', sans-serif" font-size="12" fill="#2B2D42" text-anchor="middle">NICE GUY</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 400)" filter="url(#shadow-1999)">
    <rect x="-140" y="-45" width="280" height="65" rx="12" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5"/>
    <text x="0" y="-7" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#8338EC" text-anchor="middle" letter-spacing="3">19.99</text>
    <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2D42" text-anchor="middle" letter-spacing="3">3RD EP ALBUM</text>
  </g>
  <text x="250" y="55" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOYNEXTDOOR</text>
</svg>
